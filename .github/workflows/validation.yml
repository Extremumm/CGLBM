name: Validation

# The long tests run a full simulation each, so they are not part of every
# push. This runs them on a schedule and on demand, and records what the
# solver actually measured in the job summary.
on:
  schedule:
    # Mondays at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laplace:
    name: Laplace benchmark
    runs-on: ubuntu-latest
    # three full laplace runs of about ten minutes each (density ratio 20 with E8
    # and E4, density ratio 1e4), six droplet runs of about five and a layers
    # run of under one
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libopenmpi-dev openmpi-bin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e PyCGLBM

      - name: Configure and build
        run: |
          cmake --preset gnu -DDEBUG=OFF -DPython3_EXECUTABLE="$(which python)"
          cmake --build --preset gnu --target laplace_opt droplet_opt layers_opt

      - name: Run the long tests
        run: |
          python -m pytest programs/solvers/color_gradient/laplace \
            programs/solvers/velocity_based --runlong -v

      - name: Record what was measured
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import math, pathlib
          import numpy as np
          from pycglbm import CaseOutput

          C_DX = 1.0e-5
          C_DT = C_DX / 347.0 / math.sqrt(3.0)
          SIGMA = 1.0 / (C_DX**3 / C_DT**2)

          print("## Laplace benchmark\n")
          runs = {
              "density ratio 20 (`laplace`)": pathlib.Path("artifacts/laplace"),
              "density ratio 1e4 (`laplace E8 1e4 1`)": pathlib.Path("artifacts/laplace_ratio_1e4"),
          }
          for title, rundir in runs.items():
              print(f"### {title}\n")
              if not rundir.is_dir():
                  print("No run directory: the tests did not get as far as running the solver.\n")
                  continue

              case = CaseOutput(rundir)
              t = case.last_timestep
              jump = case.pressure_jump(t, inner=5.0, outer=30.0)
              r_rho = case.density_interface_radius(t)
              r_phi = case.phase_interface_radius(t)
              velocity = case.velocity(t)
              speed = (velocity[..., 0] ** 2 + velocity[..., 1] ** 2) ** 0.5

              print("| quantity | value |")
              print("| --- | --- |")
              print(f"| timestep | {t} |")
              print(f"| pressure jump | {jump:.6f} |")
              print(f"| density interface radius | {r_rho:.3f} |")
              print(f"| phase interface radius | {r_phi:.3f} |")
              print(f"| interface split | {r_phi - r_rho:.3f} |")
              print(f"| jump / (sigma / R_rho) | {jump / (SIGMA / r_rho):.4f} |")
              print(f"| max spurious velocity | {speed.max():.3e} |")
              print()

          print("## Velocity-based droplet solver\n")
          static = pathlib.Path("artifacts/droplet_static")
          if static.is_dir():
              case = CaseOutput(static)
              t = case.last_timestep
              jump = case.pressure_jump(t, inner=5.0, outer=30.0)
              radius = case.phase_interface_radius(t)
              velocity = case.velocity(t)
              speed = (velocity[..., 0] ** 2 + velocity[..., 1] ** 2) ** 0.5
              print("### static, density ratio 1e4 (`droplet E8 1e4 0`)\n")
              print("| quantity | value |")
              print("| --- | --- |")
              print(f"| timestep | {t} |")
              print(f"| jump / (sigma / R) | {jump / (SIGMA / radius):.4f} |")
              print(f"| max spurious velocity | {speed.max():.3e} |")
              print()
          for ratio in ("1e4", "100"):
              moving = pathlib.Path(f"artifacts/droplet_moving_{ratio}")
              if not moving.is_dir():
                  continue
              case = CaseOutput(moving)
              t = case.last_timestep
              momentum = [(case.density(s) * case.velocity(s)[..., 0]).sum() for s in (0, t)]
              print(f"### moving, density ratio {ratio} (`droplet E8 {ratio} 0.01`)\n")
              print("| quantity | value |")
              print("| --- | --- |")
              print(f"| timestep | {t} |")
              print(f"| total momentum drift | {(momentum[1] - momentum[0]) / momentum[0]:+.2e} |")
              print()
          for viscosity in ("1", "10", "100"):
              fast = pathlib.Path(f"artifacts/droplet_fast_{viscosity}")
              if not fast.is_dir():
                  continue
              case = CaseOutput(fast)
              t = case.last_timestep
              momentum = [(case.density(s) * case.velocity(s)[..., 0]).sum() for s in (0, t)]
              print(f"### fast, viscosity ratio {viscosity} (`droplet E8 1e4 0.1 {viscosity}`)\n")
              print("| quantity | value |")
              print("| --- | --- |")
              print(f"| timestep | {t} |")
              print(f"| total momentum drift | {(momentum[1] - momentum[0]) / momentum[0]:+.2e} |")
              print()
          layers = pathlib.Path("artifacts/layers")
          if layers.is_dir():
              case = CaseOutput(layers)
              t = case.last_timestep
              u = case.velocity(t)[..., 0]
              ny = u.shape[0]
              exact = 0.01 * np.sin(2.0 * np.pi * np.arange(ny) / ny)[:, None]
              error = np.abs(u - exact) / 0.01
              light = case.phase(t) < 0.0
              print("### sheared layers, density ratio 1e4 (`layers E8 1e4 0.01`)\n")
              print("| quantity | value |")
              print("| --- | --- |")
              print(f"| timestep | {t} |")
              print(f"| max error, light layer / U | {error[light].max():.4f} |")
              print(f"| max error, heavy layer / U | {error[~light].max():.5f} |")
              print()
          PY

      - name: Upload the run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          # The CSV grids are tens of megabytes; the logs say what happened.
          path: |
            artifacts/**/run.log
          if-no-files-found: warn
          retention-days: 30
