[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["programs"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "unit_test: fast test of one component, no simulation",
    "validation: compares a run against reference or measured behaviour",
    "verification: checks an internal consistency property of a run",
    "long: test that runs a full simulation (needs --runlong)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
# cmake-format.py is a cmake-format configuration file, not Python source: it is
# evaluated with `section()` and friends already in scope.
extend-exclude = ["cmake-format.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
