repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: mixed-line-ending

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c++, c]
        # The solver programs and the two headers that came with them predate
        # this style. Reformatting them would bury the physics under about 400
        # lines of churn each, so they are left as they are; src/ and the
        # unit-test programs are formatted.
        exclude: |
          (?x)^(
            programs/solvers/.*|
            src/core/constants\.h|
            src/lbm/lattice_boltzmann\.h|
            src/main_cglbm\.cpp|
            archive/.*
          )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        args: ["-c", "cmake-format.py"]
